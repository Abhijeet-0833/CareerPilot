version: '3.8'

services:
  careerpilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres-db:5432/careerpilotdb
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=secret_postgres_pass
      - JWT_SECRET=9a6f8b12c4e5780d314285960a7142bc890e1f3a567489b201cd34ef56789abc
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM=noreply@careerpilot.ai
      - APP_FRONTEND_URL=http://localhost:3000
    depends_on:
      - postgres-db
      - redis-cache
      - mailpit

  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careerpilotdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_postgres_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: careerpilot-mailpit
    ports:
      - "8025:8025" # Mailpit Web UI
      - "1025:1025" # Mailpit SMTP

volumes:
  postgres-data:

